# Moemon Kai: checks the ORRE_DISC_URL secret (docs/ORRE_HANDOFF.md "Shipping") without publishing anything: that it's
# there, that it's a link, and that the disc behind it downloads (its first megabyte, the way tools/orre/make_pack.sh
# fetches it). Never prints the secret. Run by hand: Actions > ORRE secret check > Run workflow.
name: ORRE secret check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The secret and its disc
        env:
          ORRE_DISC_URL: ${{ secrets.ORRE_DISC_URL }}
        run: |
          if [ -z "$ORRE_DISC_URL" ]; then
            echo "::error::ORRE_DISC_URL isn't set as a repository secret for Actions (or it's empty)"
            exit 1
          fi
          echo "ORRE_DISC_URL is set (${#ORRE_DISC_URL} characters)"
          URL="$ORRE_DISC_URL"
          if [[ "$URL" =~ drive\.google\.com/file/d/([^/]+) ]]; then
            echo "it's a Google Drive file link"
            URL="https://drive.usercontent.google.com/download?id=${BASH_REMATCH[1]}&export=download&confirm=t"
          elif [[ "$URL" =~ ^https?:// ]]; then
            echo "it's a web link"
          else
            echo "::error::ORRE_DISC_URL isn't a link (it should start with https://)"
            exit 1
          fi
          curl -sSfL --retry 3 -r 0-1048575 -o head.bin "$URL" || { echo "::error::the disc's link didn't download"; exit 1; }
          SIZE=$(stat -c %s head.bin)
          echo "downloaded the first $SIZE bytes"
          if head -c 512 head.bin | grep -qi "<html"; then
            echo "::error::the link gives a web page, not the disc (is the Drive file shared to anyone with the link?)"
            exit 1
          fi
          echo "the disc downloads: the release can rip ORRE's packs"
