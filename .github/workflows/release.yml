# Moemon Co-op: a new MOEMON_VERSION (include/mp_version.h) pushed to the default branch builds the Windows
# and Linux games, tests the updater and publishes release v<version> (tag included), which the game's updater
# reads (src/platform/updater.c): both zips and update.txt. Notes come from tools/release/notes/v<version>.md.
# Also runs by hand (Actions > Release > Run workflow). A version that already has a release is skipped.
name: Release

on:
  push:
    paths: ['include/mp_version.h']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # (the DANCE machine's songs zip and ORRE's packs, when they change)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_APP_KEY: ${{ secrets.MOEMON_APK_KEYSTORE_B64 }}
        run: |
          VER=$(sed -n 's/^#define MOEMON_VERSION "\(.*\)"/\1/p' include/mp_version.h)
          [ -n "$VER" ]
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" > /dev/null 2>&1; then
            # (run by hand once the app's signing secrets are in: a release without the app gets it added)
            if [ -n "$HAS_APP_KEY" ] && ! gh release view "v$VER" --json assets -q '.assets[].name' | grep -qx MoemonCompanion.apk; then
              echo "v$VER has no app yet: only the app is built and added to it"
              echo "apponly=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$VER is already released: nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # The runner's Ubuntu mirror sometimes stalls in the middle of a download (normally this takes under a
      # minute). The .debs are kept between runs, and tools/release/ci_tools.sh stops a stalled try and goes on
      # from another mirror; it says how.
      - name: Package cache
        if: steps.ver.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/debs
          key: debs-${{ runner.os }}-${{ hashFiles('tools/release/ci_tools.sh') }}-${{ github.run_id }}
          restore-keys: debs-${{ runner.os }}-${{ hashFiles('tools/release/ci_tools.sh') }}-

      - name: Tools
        if: steps.ver.outputs.skip != 'true'
        run: tools/release/ci_tools.sh "$RUNNER_TEMP/debs"

      - name: Keep the packages
        if: always() && steps.ver.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/debs
          key: debs-${{ runner.os }}-${{ hashFiles('tools/release/ci_tools.sh') }}-${{ github.run_id }}

      - name: SDL2 for Windows (2.30.9, checked)
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        run: |
          # (a download can fail or come back as an error page: tried again, the file checked each time)
          ok=
          for wait in 0 5 15 30 60; do
            sleep $wait
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/sdl2.tar.gz" https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz || continue
            if echo "b188d165dc4a0372042bff3d0c18e9bb90772581e92a7b8b47b521b47714f75c  $RUNNER_TEMP/sdl2.tar.gz" | sha256sum -c; then ok=1; break; fi
            ls -l "$RUNNER_TEMP/sdl2.tar.gz"; head -c 300 "$RUNNER_TEMP/sdl2.tar.gz" | od -c | head -5
          done
          [ -n "$ok" ] || { echo "SDL2 download failed its checksum every time"; exit 1; }
          tar xzf "$RUNNER_TEMP/sdl2.tar.gz" -C "$RUNNER_TEMP"

      - name: Song table (custom music in music/, every song and where it plays)
        if: steps.ver.outputs.skip != 'true'
        run: python3 tools/kaisong/gen.py

      # SINNOH's packs (docs/SINNOH_HANDOFF.md): Platinum's map models, props, textures, lights and collision, its
      # people's sprites, its words, and its scripts converted to this game's (sinnoh/platinum_scripts.inc, which the
      # builds below include), all from pret/pokeplatinum at a pinned commit (nothing of it is in this repository);
      # package.sh ships the packs in sinnoh/. Before the builds: they compile the converted scripts in.
      - name: SINNOH packs and scripts
        if: steps.ver.outputs.skip != 'true'
        run: tools/sinnoh/make_pack.sh "$RUNNER_TEMP/pokeplatinum"

      - name: Linux build
        if: steps.ver.outputs.skip != 'true'
        run: make linux -j"$(nproc)"

      # Custom music (music/*.kaisong) all equally loud (tools/kaisong/normalize.py): each song measured in the game
      # just built, rendered as fast as it runs, one gain a file (dynamics untouched) into music/kaisong_gains.txt,
      # which package.sh ships. Measurements are cached by file content in the repository, so only new or changed songs
      # are measured: well under a second with nothing new, about a second a new song. If it can't run, the committed
      # gains ship as they are.
      - name: Music loudness
        if: steps.ver.outputs.skip != 'true'
        run: |
          python3 tools/kaisong/normalize.py --bin ./pokeemerald64 || echo "normalize.py failed, the committed gains ship"

      - name: Windows build
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        run: tools/release/build_windows.sh "$RUNNER_TEMP/SDL2-2.30.9"

      # Saves must load on every platform: the save's structures compiled for Linux and for Windows (whose bitfield
      # layout differs) must match tools/test/save_layout.txt, and scripts' table lookups must be in range.
      # A failure stops the release (1.60.0 broke Windows saves this way).
      - name: Save layout and script checks
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        run: |
          REQUIRE_WINDOWS=1 python3 tools/test/save_layout.py
          python3 tools/test/check_scripts.py

      # The DANCE machine's songs (docs/RHYTHM_DECISIONS.md #10): their own zip, which the game downloads when the
      # machine is first used. When the songs are the same as the last release's, its line is kept and nothing is
      # uploaded again (the zip stays on the release that has it).
      - name: The DANCE machine's songs
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.ver.outputs.tag }}
          mkdir -p dist
          tools/release/package_songs.sh "$RUNNER_TEMP/songs"
          ID=$(cat "$RUNNER_TEMP/songs/songs_id.txt")
          PREV=""
          if gh release download --pattern update.txt --dir "$RUNNER_TEMP/prev" > /dev/null 2>&1; then
            PREV=$(grep '^songs ' "$RUNNER_TEMP/prev/update.txt" || true)
          fi
          if [ -n "$PREV" ] && [ "$(echo "$PREV" | awk '{print $6}')" = "$ID" ]; then
            echo "the songs are the same as on $(echo "$PREV" | awk '{print $2}'): not uploaded again"
            echo "$PREV" > dist/songs.txt
          else
            Z="$RUNNER_TEMP/songs/MoemonDanceSongs.zip"
            mv "$Z" dist/
            echo "songs $TAG MoemonDanceSongs.zip $(stat -c %s dist/MoemonDanceSongs.zip) $(sha256sum dist/MoemonDanceSongs.zip | cut -d' ' -f1) $ID" > dist/songs.txt
          fi
          cat dist/songs.txt

      # ORRE's packs (docs/ORRE_DECISIONS.md): Pokemon Colosseum's maps, text, collision, scripts and character models,
      # ripped from the disc whose link is the ORRE_DISC_URL secret (never in this repository) into orre/ at every
      # release, and shipped inside the game's own zips (tools/release/package.sh), so every update replaces them with
      # the game (the user, 2026-11-08: no separate download). Without the secret the release has no ORRE packs.
      - name: ORRE's packs
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        env:
          ORRE_DISC_URL: ${{ secrets.ORRE_DISC_URL }}
        run: |
          if [ -n "$ORRE_DISC_URL" ]; then
            ORRE_WORK="$RUNNER_TEMP/orre_work" tools/orre/make_pack.sh
            rm -rf "$RUNNER_TEMP/orre_work"
          else
            echo "::warning::no ORRE_DISC_URL secret: this release has no ORRE packs"
          fi

      # The Moemon Companion app (android/, docs/PHONE_LINK.md): the game's art exported by the Linux build, then the
      # APK signed with the release key from the repository's secrets (MOEMON_APK_KEYSTORE_B64: the keystore in base64,
      # MOEMON_APK_PASSWORD). Without them the release goes out without the app. A failed app build never holds the
      # game back: it says so as a warning.
      - name: Java for the app
        if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Companion app (APK)
        if: steps.ver.outputs.skip != 'true'
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.MOEMON_APK_KEYSTORE_B64 }}
          MOEMON_APK_STORE_PASSWORD: ${{ secrets.MOEMON_APK_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::no MOEMON_APK_KEYSTORE_B64 secret: the release has no app"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MOEMON_APK_KEYSTORE="$RUNNER_TEMP/release.jks"
          # (Pillow: the POKéMON cards' pictures go into the app as WebP)
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install -q --user --break-system-packages pillow \
            || { sudo apt-get update -q && sudo apt-get install -y -q python3-pil; }
          python3 -c 'from PIL import Image, features; assert features.check("webp")'
          python3 android/build_assets.py
          (cd android && ./gradlew --no-daemon -q assembleRelease) || { echo "::warning::the app didn't build"; exit 0; }
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/MoemonCompanion.apk
          ls -la dist/MoemonCompanion.apk

      # POKeMON STADIUM's announcer (docs/STADIUM.md "The announcer"): the voices from Pokemon Stadium (USA) 1.0, whose
      # link is the STADIUM_ROM_URL secret, and the Japanese ones from POKEMON STADIUM 2 (Japan), the STADIUM_JP_ROM_URL
      # secret (never in this repository: a .z64 or a zip holding one). They go in the packages as stadium/announcer.s1
      # and announcer_jp.s1. Without a secret the release goes out without those voices (a player can drop their own
      # ROM in the game's stadium/ folder instead).
      - name: STADIUM's announcer
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        env:
          STADIUM_ROM_URL: ${{ secrets.STADIUM_ROM_URL }}
          STADIUM_JP_ROM_URL: ${{ secrets.STADIUM_JP_ROM_URL }}
        run: |
          if [ -n "$STADIUM_ROM_URL" ]; then
            STADIUM_WORK="$RUNNER_TEMP/stadium_voice" tools/stadium/mort/make_pack.sh || echo "::warning::the STADIUM announcer's voices didn't build"
            rm -rf "$RUNNER_TEMP/stadium_voice"
          else
            echo "::warning::no STADIUM_ROM_URL secret: the release has no STADIUM announcer voices"
          fi
          if [ -n "$STADIUM_JP_ROM_URL" ]; then
            STADIUM_ROM_URL="$STADIUM_JP_ROM_URL" STADIUM_WORK="$RUNNER_TEMP/stadium_voice_jp" tools/stadium/mort/make_pack.sh || echo "::warning::the STADIUM announcer's Japanese voices didn't build"
            rm -rf "$RUNNER_TEMP/stadium_voice_jp"
          else
            echo "::warning::no STADIUM_JP_ROM_URL secret: the release has no Japanese STADIUM announcer voices"
          fi

      - name: Packages and update.txt
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        run: |
          tools/release/package.sh linux dist
          SDL2_DLL="$RUNNER_TEMP/SDL2-2.30.9/x86_64-w64-mingw32/bin/SDL2.dll" tools/release/package.sh windows dist
          tools/release/manifest.sh dist

      - name: Updater test (Linux)
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        run: NOBUILD=1 OUT="$RUNNER_TEMP/update_test" tools/test/update_test.sh

      - name: Publish
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.apponly != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.ver.outputs.tag }}
          NOTES="tools/release/notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "Moemon Emerald Kai Co-op $TAG" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          # the build's title from the notes' first line: Moemon Emerald Kai Co-op <ver> "<Title!>": <summary>
          NAME="Moemon Emerald Kai Co-op $TAG"
          TITLE=$(head -1 "$NOTES" | sed -n 's/^Moemon Emerald Kai Co-op [0-9.]* "\([^"]*\)":.*/\1/p')
          if [ -n "$TITLE" ]; then NAME="$NAME: $TITLE"; fi
          SONGS=""
          [ -f dist/MoemonDanceSongs.zip ] && SONGS=dist/MoemonDanceSongs.zip
          [ -f dist/MoemonCompanion.apk ] && SONGS="$SONGS dist/MoemonCompanion.apk"
          gh release create "$TAG" dist/MoemonEmeraldKaiCoop-windows.zip dist/MoemonEmeraldKaiCoop-linux.zip dist/update.txt $SONGS \
            --target "$GITHUB_SHA" --title "$NAME" --notes-file "$NOTES" --latest

      - name: Add the app to the release
        if: steps.ver.outputs.apponly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f dist/MoemonCompanion.apk ] || { echo "the app didn't build"; exit 1; }
          gh release upload "${{ steps.ver.outputs.tag }}" dist/MoemonCompanion.apk
