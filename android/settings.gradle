// The Moemon Companion App (docs/COMPANION_APP.md, docs/PHONE_LINK.md)
pluginManagement {
    repositories {
        google()
        // (Google's mirror of Maven Central first: the central one rate-limits shared build machines)
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = 'MoemonCompanion'
include ':app'
