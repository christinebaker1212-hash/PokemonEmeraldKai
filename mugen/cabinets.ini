; VS cabinets: one section per cabinet in the game. Online, the room host's file is used.
; Leave a line out to use the pack's own value (data/mugen.cfg, the screenpack).

[mauville_gc]
; The Game Corner in MAUVILLE CITY: the slot machines at the right block's bottom row
motif = STREETFIGHTER-EX-PLUS/SFEX-SYSTEM.def
; Round wins needed to win the fight
rounds = 2
; Life in percent of each character's own (100 = normal)
life = 100
; Round time in seconds (-1 = no time limit)
time = 99
; Game speed, -9 (slow) to 9 (fast), 0 = normal
speed = 0
; Stages picked at random, comma-separated, as in the stages folder (sf2-harbor or stages/sf2-harbor.def);
; empty = every stage in the select list's [ExtraStages]
stages =
; FIGHT CPU's stage: random (from the list above) or home (the opponent's own stage from the select list)
cpu.stage = random
; Where the top of the fight HUD (life bars, timer) goes: pixels from the top of the 480x320
; picture, -1 = where the screenpack puts it (moved inside the 8-pixel safe margin if it's past it)
hud.top = 8
; The CPU's difficulty when playing alone (FIGHT CPU), 1-8
cpu.level = 4
