; Moemon Emerald Kai Co-op settings
; enabled = 1 to play online
enabled = 1
; host = 1 makes this game run the server too (other players connect to your IP)
host = 0
; address of the server (the host's IP or domain name)
server = 127.0.0.1
port = 27015
; name shown above your head (empty = your trainer name)
