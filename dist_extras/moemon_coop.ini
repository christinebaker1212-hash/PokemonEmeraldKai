; sprite = default, brendan, may, rs_brendan, rs_may or custom
sprite = default
; custom_sprite = path to a 144x32 or 288x32 PNG (used when sprite = custom)
custom_sprite =
; skin = default, porcelain, light, tan, brown, dark, deep
skin = default
; outfit / accent = default, red, blue, green, yellow, purple, pink, orange, black, white, teal
outfit = default
accent = default
; how many tiles a player in Trainer Mode can see
trainer_range = 4
