; Moemon Emerald Kai Co-op settings. The game writes this file itself;
; everything here can be changed in game (CO-OP menu).
name = 
; sprite = default, brendan, may, rs_brendan, rs_may, custom_1..3, or any sprite name from the CO-OP menu (e.g. hiker, steven)
sprite = default
custom_sprite = 
; skin = default, porcelain, light, tan, brown, dark, deep
skin = default
; outfit / accent = default, red, blue, green, yellow, purple, pink, orange, black, white, teal
outfit = default
accent = default
; hair = default, black, brown, chestnut, blonde, ginger, red, silver, white, blue, pink, purple, green, teal, gold
hair = default
; trainer card / battle pictures: match (same as the sprite) or a name from CO-OP > LOOK
trainer_pic = match
back_pic = match
; a character who rides a Pokemon or a vehicle on a bike: ride (as drawn) or bike (a bicycle)
bike = ride
; how many tiles a player holding the BATTLE FLAG can see
trainer_range = 4
; the party Moemon that follows you (SELECT in the party menu); 0 = none
follower = 00000000
; save quietly on the map every this many minutes, at safe moments (0 = off)
autosave = 5
; remembered for the next session
last_room = Moemon Co-op
last_room_key = 91f7a93851cd3fe4447b598bb80e99d42ff7362ecf5dc4ece6e64bef0a42040d
last_host_name = Moemon Co-op
; where that room is (empty: the online lobby; home: hosted on this PC) and the code that got you in
last_room_address = home
last_join_code = 
; shown to friends who join a server you host (HOST A GAME > WELCOME NOTE); | starts line 2
welcome = 
; servers you host: co-op trainers get one extra Moemon, so Double / Triple Battles work
; against smaller teams (HOST A GAME > TEAM PADDING; 0 = off)
trainer_padding = 1
; OPTIONS > GAME > LEVEL SCALING: wild Pokemon and trainers keep up with your team (online, the host's counts)
level_scaling = 1
; OPTIONS > GAME > MOVE KIND: 1 = each move physical or special on its own (Gen 4), 0 = by type (Gen 3)
move_split = 1
; OPTIONS > GAME > GENERATION: 3-9, the Pokemon, moves, abilities and types the game shows (online, the host's)
generation = 3
; OPTIONS > GAME > MEGA / Z-MOVES / DYNAMAX / TERA: 2 bits each (0 AUTO from its generation, 1 on, 2 off)
gimmicks = 0
; its settings: wild (0 off, 1 low, 2 medium, 3 high), trainers (0 off, 1 below, 2 even, 3 above), boss margin
; (0 auto, 1-9 = +0 to +8), badge caps (0 / 1), past 8 badges (0 capped until the League, 1 free, 2 always capped)
level_scaling_rules = 2 2 0 1 0
; servers you host (and playing alone): battle animations this much faster, 0, 25 or 30 (percent)
battle_anim_speed = 30
; CO-OP > SPECTATE: friends' screens in a panel under yours (0 / 1), each this many times (1-4)
spectate_panel = 0
spectate_size = 1
; OPTIONS > GAME: the cycling song on a bike, the surfing / underwater songs (1) or the map's own (0)
bike_music = 1
surf_music = 1
; OPTIONS > CO-OP > MOENAV CALLS: all, or battles (only trainers asking for a battle; story calls always come)
moenav_calls = all
; OPTIONS > CO-OP > FRIEND FINDER: both, arrows (at the edge of the screen) or radar (in the corner);
; shown = 1 while it's on (the right stick click / G)
friend_finder = both
friend_finder_shown = 0
; OPTIONS > CO-OP > STREAMER MODE: off, game, anime or original (trainer names and nicknames shown as others)
streamer_mode = off
; OPTIONS > GAME > FOLLOWERS: default (the original sprites on the map, PMD in the MOEMON GARDEN), pmd or original
follower_sprites = default
; OPTIONS > DISPLAY > SPRITE SCALING > SINNOH PEOPLE: gen4 (Platinum's sprites), mixed (Gen 3 ones where there's the same one,
; Platinum's made smaller elsewhere) or gen3 (Gen 3 ones for everyone)
sinnoh_sprites = gen4
; OPTIONS > DISPLAY > SPRITE SCALING: followers and the GARDEN's POKEMON smaller than a trainer drawn toward their
; POKEDEX height (1) or as their sprites are (0), and how far toward it (5-100, in steps of 5)
scale_followers = 0
scale_garden = 1
scale_followers_percent = 100
scale_garden_percent = 50
; OPTIONS > DISPLAY > CARD ART: printed_art (the printed pictures in the Game Boy frame), gameboy (the Game Boy
; pictures in it) or full_card (the whole printed cards)
card_art = printed_art
; OPTIONS > DISPLAY > CARD BACKS: printed (the real card back) or pixel
card_back = printed
; OPTIONS > GAME > CARD SCALING: 1 = card players' decks fit yours and how you play, 0 = by badges
card_scaling = 1
; OPTIONS > DISPLAY > BATTLE ANIMS: classic or modern (glows, trails and impacts over the same animations)
battle_anims = classic
; OPTIONS > DISPLAY > SHADOWS: 1 = a soft shadow under people and POKEMON on the field, 0 = none
shadows = 1
; advanced: use a different online lobby server (address or address:port)
lobby = 
